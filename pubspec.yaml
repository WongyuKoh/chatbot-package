name: gist_chatbot_flutter
description: "GIST chatbot widget for Flutter apps - a bottom-sheet chat panel with SSE streaming, markdown answers, and answer feedback."
version: 0.1.1
homepage: https://github.com/gsainfoteam/chatbot-package
repository: https://github.com/gsainfoteam/chatbot-package
issue_tracker: https://github.com/gsainfoteam/chatbot-package/issues

topics:
  - chatbot
  - chat
  - ai
  - widget
  - sse

screenshots:
  - description: Welcome screen with frequent questions
    path: screenshots/welcome.png
  - description: Streaming answer rendered as markdown
    path: screenshots/conversation.png
  - description: Source badges and feedback buttons
    path: screenshots/sources.png

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.2.0
  package_info_plus: ^10.2.1
  flutter_svg: ^2.0.10+1
  gpt_markdown: ^1.1.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.0

flutter:
  assets:
    - assets/images/logo.svg
    - assets/images/letsur_logo.svg
